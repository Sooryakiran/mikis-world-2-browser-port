plugins {
    id 'java'
    id 'org.teavm' version '0.16.0'
}

repositories { mavenCentral() }

configurations { portTools }
dependencies {
    implementation 'org.teavm:teavm-jso:0.16.0'
    implementation 'org.teavm:teavm-jso-apis:0.16.0'
    implementation files('build/original')
    portTools 'org.ow2.asm:asm-tree:9.9'
}

sourceSets.main.java.srcDirs = ['java']
tasks.withType(JavaCompile).configureEach { options.release = 17 }

tasks.register('compilePortTools', JavaCompile) {
    source = fileTree('tools') { include '*.java' }
    classpath = configurations.portTools
    destinationDirectory = layout.buildDirectory.dir('port-tools')
}
tasks.register('prepareOriginal', JavaExec) {
    dependsOn 'compilePortTools'
    classpath = files(tasks.compilePortTools.destinationDirectory) + configurations.portTools
    mainClass = 'PrepareOriginal'
    args projectDir.absolutePath
    inputs.file 'jar/mikis_world_2.jar'
    inputs.files fileTree('tools')
    outputs.dirs 'build/original', 'public/original'
}
compileJava.dependsOn 'prepareOriginal'

teavm.js {
    mainClass = 'BrowserGame'
    targetFileName = 'game.js'
    outputDir = file('public/generated')
    relativePathInOutputDir = ''
    moduleType = org.teavm.gradle.api.JSModuleType.ES2015
    obfuscated = false
}
